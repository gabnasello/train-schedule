<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Treinschema</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0e0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trein">

<script>
/* ================================================================
   INSTELLINGEN — pas hier je stations en tijdvensters aan.
   Dit is het enige stuk dat je ooit moet wijzigen.
   Formaat voor start/end: "UU:MM" (24-uursnotatie).
   ================================================================ */
const CONFIG = {
  morning: {
    from:  'Mechelen',   // vertrekstation 's ochtends
    to:    'Leuven',     // aankomststation 's ochtends
    start: '07:20',      // begin van het tijdvenster
    end:   '09:00'       // einde van het tijdvenster
  },
  afternoon: {
    from:  'Leuven',     // vertrekstation 's namiddags
    to:    'Mechelen',   // aankomststation 's namiddags
    start: '15:00',      // begin van het tijdvenster
    end:   '17:30'       // einde van het tijdvenster
  },
  nowMinutes: 120,        // tab "Nu": toon treinen van de komende X minuten
  moreMinutes: 60,        // knop "Toon meer": elke klik laadt zoveel minuten extra
  switchTime: '12:00',    // vanaf dit uur geldt de namiddag-richting (en is "terug" de standaard bij geen locatie)
  startTab: 'auto'        // welke tab opent: 'auto', 'now', 'morning' of 'afternoon'
                          // 'auto' = ochtend tot het einde van het ochtendvenster, daarna "Nu" tot switchTime,
                          //          namiddag tot het einde van het namiddagvenster, daarna "Nu" tot middernacht
};
/* ================================================================
   Einde instellingen. Hieronder staat enkel code — niet nodig
   om iets aan te passen voorbij dit punt.
   ================================================================ */
</script>

<style>
  :root{
    --board-bg:#0c0e0a;
    --board-bg-2:#14170f;
    --amber:#ffb300;
    --amber-dim:#8a5c00;
    --amber-glow: rgba(255,179,0,0.35);
    --green:#5ee6a0;
    --red:#ff5d5d;
    --line:#2a2e22;
    --grey:#7c8272;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background: radial-gradient(ellipse at top, #1a1d14 0%, #080906 70%);
    min-height:100vh;
    font-family: 'Courier New', 'Consolas', monospace;
    color: var(--amber);
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 14px 40px;
  }
  @media (min-width: 720px){
    .wrap{ max-width: 980px; }
  }
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 6px 4px 14px;
    border-bottom: 2px solid var(--line);
    margin-bottom: 14px;
  }
  .header h1{
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin:0;
    color: var(--grey);
    font-weight: 600;
  }
  .clock{
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--amber);
    text-shadow: 0 0 8px var(--amber-glow);
  }
  .toggle{
    display:flex;
    gap:8px;
    margin-bottom: 18px;
  }
  .toggle button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background: var(--board-bg-2);
    border: 1px solid var(--line);
    color: var(--grey);
    padding: 9px 4px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor:pointer;
    border-radius: 3px;
    transition: all .15s ease;
  }
  .toggle button small{
    font-size: 9px;
    letter-spacing: 0.3px;
    text-transform: none;
    opacity: .85;
  }
  .note{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin: -4px 0 12px;
    font-size: 11px;
    color: var(--amber);
  }
  .note[hidden]{ display:none; }
  .swap-btn{
    background:none;
    border:1px solid var(--line);
    color: var(--grey);
    padding:3px 8px;
    border-radius:3px;
    font-family:inherit;
    font-size:10px;
    cursor:pointer;
  }
  .swap-btn:hover{ color: var(--amber); border-color: var(--amber-dim); }
  .toggle button.active{
    color: var(--board-bg);
    background: var(--amber);
    box-shadow: 0 0 16px var(--amber-glow);
    border-color: var(--amber);
  }
  .route-label{
    text-align:center;
    font-size: 12px;
    color: var(--grey);
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .board{
    background: var(--board-bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow:hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(255,179,0,0.02);
  }
  #rows{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
  }
  #rows .row{
    border-right: 1px solid var(--line);
  }
  #rows .row:nth-child(3n){
    border-right: none;
  }
  @media (min-width: 720px){
    #rows{
      grid-template-columns: repeat(6, 1fr);
    }
    #rows .row:nth-child(3n){
      border-right: 1px solid var(--line);
    }
    #rows .row:nth-child(6n){
      border-right: none;
    }
  }
  .row{
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    gap: 5px;
    padding: 16px 6px;
    border-bottom: 1px solid var(--line);
    text-align:center;
  }
  .row.next{
    background: radial-gradient(ellipse at center, rgba(255,179,0,0.10), transparent 70%);
  }
  .row.past{
    opacity: 0.35;
  }
  .row.past .time,
  .row.past .via,
  .row.past .meta{
    text-decoration: line-through;
    text-decoration-color: var(--grey);
  }
  .row .time{
    font-size: 21px;
    font-weight:700;
  }
  .row .via{
    color: var(--grey);
    font-size: 11px;
    max-width: 100%;
    overflow:hidden;
    text-overflow: ellipsis;
    white-space:nowrap;
  }
  .row .meta{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 11px;
  }
  .row .plat{
    color: var(--amber);
  }
  .row .plat::before{
    content: "Sp. ";
    color: var(--grey);
  }
  .row .delay{
    font-size: 11px;
  }
  .delay.ontime{ color: var(--green); }
  .delay.late{ color: var(--red); }
  .empty, .error{
    padding: 30px 14px;
    text-align:center;
    color: var(--grey);
    font-size: 13px;
    line-height:1.6;
  }
  .error{ color: var(--red); }
  .more-btn{
    display:block;
    width:100%;
    margin-top:10px;
    background: var(--board-bg-2);
    border:1px solid var(--line);
    color: var(--amber);
    padding: 12px 8px;
    border-radius:4px;
    font-family:inherit;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .more-btn[hidden]{ display:none; }
  .more-btn:hover{ border-color: var(--amber-dim); }
  .footer{
    margin-top: 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 10px;
    color: var(--grey);
    letter-spacing: 1px;
    padding: 0 4px;
  }
  .refresh-btn{
    background:none;
    border: 1px solid var(--line);
    color: var(--grey);
    padding: 5px 10px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    cursor:pointer;
    text-transform: uppercase;
  }
  .refresh-btn:hover{ color: var(--amber); border-color: var(--amber-dim); }
  .blink{ animation: blink 1.4s infinite; }
  @keyframes blink{ 50%{ opacity:0.35; } }
  .flap{
    display:inline-block;
    animation: flapin .5s ease;
  }
  @keyframes flapin{
    0%{ opacity:0; transform: translateY(-4px); }
    100%{ opacity:1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 id="page-title">—</h1>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="toggle">
    <button id="btn-morning" onclick="setMode('morning')"></button>
    <button id="btn-afternoon" onclick="setMode('afternoon')"></button>
    <button id="btn-now" onclick="setMode('now')"></button>
  </div>

  <div class="route-label" id="route-label"></div>
  <div class="note" id="note" hidden>
    <span id="note-text"></span>
    <button class="swap-btn" onclick="flipNowDirection()">⇄ keer om</button>
  </div>

  <div class="board">
    <div id="rows">
      <div class="empty blink">Treinen laden…</div>
    </div>
  </div>

  <button class="more-btn" id="more-btn" onclick="showMore()" hidden></button>

  <div class="footer">
    <span id="last-updated">—</span>
    <button class="refresh-btn" onclick="load()">↻ Ververs</button>
  </div>
</div>

<script>
function $(id){ return document.getElementById(id); }
function pad(n){ return n.toString().padStart(2,'0'); }

const NOW_MINUTES = CONFIG.nowMinutes || 120;
const MORE_MINUTES = CONFIG.moreMinutes || 60;
let extraMinutes = 0;     // grows each time "Toon meer" is pressed; reset when switching tab
let mode = null;          // 'morning' | 'afternoon' | 'now'
let timer = null;
let loadToken = 0;        // guards against slow responses arriving out of order
let flipNow = false;      // manual "other direction" override in 'now' mode
let stationCache = null;

function toMin(hhmmStr){
  const [h, m] = hhmmStr.split(':').map(Number);
  return h*60 + m;
}

function minutesNow(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}

// Before switchTime the morning direction (inbound) is the likely one,
// afterwards the afternoon direction (outbound). Used as the fallback
// direction in 'Nu' when there is no location.
function timeOfDayMode(){
  return minutesNow() < toMin(CONFIG.switchTime || '12:00') ? 'morning' : 'afternoon';
}

function initialMode(){
  const t = CONFIG.startTab;
  if(t === 'now' || t === 'morning' || t === 'afternoon') return t;
  const n = minutesNow();
  if(n <= toMin(CONFIG.morning.end)) return 'morning';        // still within the morning commute
  if(n < toMin(CONFIG.switchTime || '12:00')) return 'now';   // morning commute over, before midday
  if(n <= toMin(CONFIG.afternoon.end)) return 'afternoon';    // afternoon commute (not over yet)
  return 'now';                                               // evening, after the afternoon commute
}

function fmtDur(m){
  return m % 60 === 0 ? `${m/60} u` : `${m} min`;
}

function makeBtn(id, title, sub){
  const b = $(id);
  b.innerHTML = '';
  const t = document.createElement('span');
  t.textContent = title;
  const s = document.createElement('small');
  s.textContent = sub;
  b.appendChild(t);
  b.appendChild(s);
}

function initLabels(){
  $('page-title').textContent = `${CONFIG.morning.from} ⇄ ${CONFIG.morning.to}`;
  makeBtn('btn-morning', 'Ochtend', `${CONFIG.morning.from} → ${CONFIG.morning.to}`);
  makeBtn('btn-afternoon', 'Namiddag', `${CONFIG.afternoon.from} → ${CONFIG.afternoon.to}`);
  makeBtn('btn-now', 'Nu', `dichtstbij · ${fmtDur(NOW_MINUTES)}`);
}

function setMode(m){
  mode = m;
  extraMinutes = 0;
  $('more-btn').hidden = true;
  ['morning','afternoon','now'].forEach(k => $('btn-' + k).classList.toggle('active', k === m));
  $('note').hidden = (m !== 'now');
  if(m === 'now'){
    flipNow = false;
    $('note-text').textContent = '';
    $('route-label').textContent = 'Locatie bepalen…';
  } else {
    const c = CONFIG[m];
    $('route-label').textContent = `${c.from} → ${c.to}  ·  ${c.start}–${c.end}`;
  }
  load();
}

function flipNowDirection(){
  flipNow = !flipNow;
  extraMinutes = 0;
  load();
}

function showMore(){
  extraMinutes += MORE_MINUTES;
  load(true);   // keep the current list on screen while the extra trains load
}

function updateClock(){
  const d = new Date();
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
setInterval(updateClock, 1000);
updateClock();

/* ---------- date helpers ---------- */
function atTime(hhmmStr){
  const [h, m] = hhmmStr.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}
function ddmmyy(d){ return `${pad(d.getDate())}${pad(d.getMonth()+1)}${d.getFullYear().toString().slice(-2)}`; }
function hhmm(d){ return `${pad(d.getHours())}${pad(d.getMinutes())}`; }
function fmtTime(unixSeconds){
  const d = new Date(parseInt(unixSeconds,10)*1000);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function depMs(c){ return parseInt(c.departure.time,10)*1000; }
// scheduled departure + delay = when the train really leaves
function depEffectiveMs(c){ return depMs(c) + parseInt(c.departure.delay || '0', 10)*1000; }

/* ---------- iRail ---------- */
async function fetchBatch(s, when){
  const url = `https://api.irail.be/connections/?from=${encodeURIComponent(s.from)}&to=${encodeURIComponent(s.to)}&date=${ddmmyy(when)}&time=${hhmm(when)}&timesel=departure&results=10&format=json&lang=en`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return data.connection || [];
}

// All departures between startDate and endDate. The API returns a limited
// number of connections per request, so keep asking, moving past the last
// departure each time, until the whole window is covered.
async function fetchWindow(s, startDate, endDate){
  const seen = new Map();
  let cursor = new Date(startDate);
  let guard = 0;
  while(cursor <= endDate && guard < 8){
    guard++;
    const batch = await fetchBatch(s, cursor);
    if(batch.length === 0) break;
    let last = cursor.getTime();
    for(const c of batch){
      const t = depMs(c);
      if(t >= startDate.getTime() && t <= endDate.getTime()){
        const key = c.departure.departureConnection || (c.departure.time + '-' + c.departure.vehicle);
        seen.set(key, c);
      }
      if(t > last) last = t;
    }
    if(last <= cursor.getTime()) break; // no progress, avoid infinite loop
    cursor = new Date(last + 60000);
  }
  return Array.from(seen.values()).sort((a,b) => depMs(a) - depMs(b));
}

async function loadStations(){
  if(stationCache) return stationCache;
  const res = await fetch('https://api.irail.be/stations/?format=json&lang=en');
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  stationCache = data.station || [];
  return stationCache;
}

function findStation(list, name){
  const n = name.trim().toLowerCase();
  const std = s => (s.standardname || '').toLowerCase();
  const nm = s => (s.name || '').toLowerCase();
  return list.find(s => std(s) === n || nm(s) === n)
      || list.find(s => std(s).startsWith(n));
}

function coordsOf(st){
  let lat = parseFloat(st.locationY), lon = parseFloat(st.locationX);
  if(lat < lon){ const t = lat; lat = lon; lon = t; } // Belgium: lat (~51) is always larger than lon (~4)
  return { lat, lon };
}

/* ---------- location ---------- */
function getPosition(){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation) return reject({ code: 0 });
    navigator.geolocation.getCurrentPosition(
      p => resolve(p.coords),
      e => reject(e),
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
    );
  });
}

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function fmtDist(km){
  return km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1).replace('.', ',')} km`;
}

// Picks the commute route that departs from the station closest to you.
// Falls back to the morning/afternoon route (by time of day) if location fails.
async function resolveNowRoute(){
  const routes = [CONFIG.morning, CONFIG.afternoon];
  let route = CONFIG[timeOfDayMode()];
  let note;
  try{
    const [pos, stations] = await Promise.all([getPosition(), loadStations()]);
    let best = null;
    for(const r of routes){
      const st = findStation(stations, r.from);
      if(!st) continue;
      const c = coordsOf(st);
      const d = haversineKm(pos.latitude, pos.longitude, c.lat, c.lon);
      if(!best || d < best.d) best = { r, d };
    }
    if(best){
      route = best.r;
      note = `📍 Dichtstbij: ${best.r.from} (${fmtDist(best.d)})`;
    } else {
      note = 'Station niet gevonden — route volgens het uur';
    }
  } catch(e){
    note = (e && e.code === 1)
      ? 'Locatie geweigerd — route volgens het uur'
      : 'Locatie niet beschikbaar — route volgens het uur';
  }
  if(flipNow){
    route = { from: route.to, to: route.from };
    note += ' · omgekeerd';
  }
  return { route, note };
}

/* ---------- main ---------- */
async function load(quiet){
  const token = ++loadToken;
  const rowsEl = $('rows');
  if(!quiet) rowsEl.innerHTML = '<div class="empty blink">Treinen laden…</div>';

  try{
    let route, start, end, emptyMsg, keepFrom = null;

    if(mode === 'now'){
      const r = await resolveNowRoute();
      if(token !== loadToken) return;
      route = r.route;
      const now = new Date();
      start = new Date(now.getTime() - 10*60000);   // catch trains that are delayed
      const span = NOW_MINUTES + extraMinutes;
      end = new Date(now.getTime() + span*60000);
      keepFrom = now.getTime();
      $('note-text').textContent = r.note;
      $('route-label').textContent = `${route.from} → ${route.to}  ·  nu → +${fmtDur(span)}`;
      emptyMsg = `Geen treinen in de komende ${fmtDur(span)}.`;
    } else {
      const c = CONFIG[mode];
      route = c;
      start = atTime(c.start);
      end = new Date(atTime(c.end).getTime() + extraMinutes*60000);
      const endLabel = `${pad(end.getHours())}:${pad(end.getMinutes())}`;
      $('route-label').textContent = `${c.from} → ${c.to}  ·  ${c.start}–${endLabel}`;
      emptyMsg = `Geen treinen gevonden tussen ${c.start} en ${endLabel}.`;
    }

    let conns = await fetchWindow(route, start, end);
    if(token !== loadToken) return;
    if(keepFrom !== null) conns = conns.filter(c => depEffectiveMs(c) >= keepFrom);

    if(conns.length === 0){
      rowsEl.innerHTML = `<div class="empty">${emptyMsg}<br>Probeer te verversen of controleer belgiantrain.be.</div>`;
    } else {
      renderRows(conns);
    }

    $('more-btn').textContent = `▾ Toon meer · +${fmtDur(MORE_MINUTES)}`;
    $('more-btn').hidden = false;

    const n = new Date();
    $('last-updated').textContent = `bijgewerkt ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  } catch(err){
    if(token !== loadToken) return;
    $('more-btn').hidden = true;
    rowsEl.innerHTML = `<div class="error">Kan geen verbinding maken met de iRail-data.<br>${err.message}<br><br>Controleer je internetverbinding of probeer later opnieuw.</div>`;
  }
}

function renderRow(c, isNext, isPast){
  const dep = c.departure;
  const delaySec = parseInt(dep.delay || '0', 10);
  const platform = dep.platform || '?';
  const vehicle = (dep.vehicleinfo && dep.vehicleinfo.shortname) || (c.vehicle || '').split('.').pop() || '';
  const delayLabel = delaySec > 0
    ? `<span class="delay late">+${Math.round(delaySec/60)}′</span>`
    : `<span class="delay ontime">op tijd</span>`;
  const canceled = dep.canceled === '1';
  return `<div class="row ${isNext ? 'next' : ''} ${isPast ? 'past' : ''} flap">
    <div class="time">${fmtTime(dep.time)}</div>
    <div class="via">${vehicle}</div>
    <div class="meta">
      <span class="plat">${platform}</span>
      ${canceled ? '<span class="delay late">geschrapt</span>' : delayLabel}
    </div>
  </div>`;
}

function renderRows(conns){
  const nowMs = Date.now();
  let nextMarked = false;
  $('rows').innerHTML = conns.map(c => {
    const isPast = depEffectiveMs(c) <= nowMs;
    const isNext = !nextMarked && !isPast;
    if(isNext) nextMarked = true;
    return renderRow(c, isNext, isPast);
  }).join('');
}

initLabels();
setMode(initialMode());
timer = setInterval(() => load(true), 60000);
</script>
</body>
</html>
