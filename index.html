<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Treinschema</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" id="manifest-link" href="manifest.json">
<meta name="theme-color" content="#0c0e0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trein">

<script>
/* ================================================================
   INSTELLINGEN — pas hier je stations aan.
   Dit is het enige stuk dat je ooit moet wijzigen.
   Formaat voor uren: "UU:MM" (24-uursnotatie).
   ================================================================ */
const CONFIG = {
  stationA: 'Mechelen',          // eerste station van je traject
  stationB: 'Leuven',            // tweede station van je traject

  nowMinutes: 120,               // zoveel minuten vooruit tonen (vanaf nu)
  moreMinutes: 60,               // elke klik op "Toon meer" voegt zoveel minuten toe

  // Alleen gebruikt als de locatie niet beschikbaar is:
  firstDirectionFrom: '01:00',   // vanaf dit uur: richting A → B
  secondDirectionFrom: '12:00'   // vanaf dit uur tot firstDirectionFrom: richting B → A
};
/* ================================================================
   Einde instellingen. Hieronder staat enkel code — niet nodig
   om iets aan te passen voorbij dit punt.
   ================================================================ */
</script>

<style>
  :root{
    --board-bg:#0c0e0a;
    --board-bg-2:#14170f;
    --amber:#ffb300;
    --amber-dim:#8a5c00;
    --amber-glow: rgba(255,179,0,0.35);
    --green:#5ee6a0;
    --red:#ff5d5d;
    --line:#2a2e22;
    --grey:#7c8272;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background: radial-gradient(ellipse at top, #1a1d14 0%, #080906 70%);
    min-height:100vh;
    font-family: 'Courier New', 'Consolas', monospace;
    color: var(--amber);
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 14px 40px;
  }
  @media (min-width: 720px){
    .wrap{ max-width: 980px; }
  }
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 6px 4px 14px;
    border-bottom: 2px solid var(--line);
    margin-bottom: 14px;
  }
  .header h1{
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin:0;
    color: var(--grey);
    font-weight: 600;
  }
  .clock{
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--amber);
    text-shadow: 0 0 8px var(--amber-glow);
  }
  .board{
    background: var(--board-bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow:hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(255,179,0,0.02);
  }
  #rows{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
  }
  #rows .row{
    border-right: 1px solid var(--line);
  }
  #rows .row:nth-child(3n){
    border-right: none;
  }
  @media (min-width: 720px){
    #rows{
      grid-template-columns: repeat(6, 1fr);
    }
    #rows .row:nth-child(3n){
      border-right: 1px solid var(--line);
    }
    #rows .row:nth-child(6n){
      border-right: none;
    }
  }
  .row{
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    gap: 5px;
    padding: 16px 6px;
    border-bottom: 1px solid var(--line);
    text-align:center;
  }
  .row.next{
    background: radial-gradient(ellipse at center, rgba(255,179,0,0.10), transparent 70%);
  }
  .row.past{
    opacity: 0.35;
  }
  .row.past .time,
  .row.past .via,
  .row.past .meta{
    text-decoration: line-through;
    text-decoration-color: var(--grey);
  }
  .row .time{
    font-size: 21px;
    font-weight:700;
  }
  .row .via{
    color: var(--grey);
    font-size: 11px;
    max-width: 100%;
    overflow:hidden;
    text-overflow: ellipsis;
    white-space:nowrap;
  }
  .row .meta{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 11px;
  }
  .row .plat{
    color: var(--amber);
  }
  .row .plat::before{
    content: "Sp. ";
    color: var(--grey);
  }
  .row .delay{
    font-size: 11px;
  }
  .delay.ontime{ color: var(--green); }
  .delay.late{ color: var(--red); }
  .empty, .error{
    padding: 30px 14px;
    text-align:center;
    color: var(--grey);
    font-size: 13px;
    line-height:1.6;
  }
  .error{ color: var(--red); }
  .more-btn{
    display:block;
    width:100%;
    margin-top:10px;
    background: var(--board-bg-2);
    border:1px solid var(--line);
    color: var(--amber);
    padding: 12px 8px;
    border-radius:4px;
    font-family:inherit;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .more-btn[hidden]{ display:none; }
  .time-controls{display:flex;gap:8px;margin-top:8px;}
  .time-controls button{flex:1;background:var(--board-bg-2);border:1px solid var(--line);color:var(--grey);padding:9px 8px;border-radius:4px;font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
  .time-controls button:hover{color:var(--amber);border-color:var(--amber-dim);}
  .row.cancelled{opacity:.48;}
  .row.cancelled .time,.row.cancelled .via,.row.cancelled .meta{text-decoration:line-through;text-decoration-color:var(--red);}
  .more-btn:hover{ border-color: var(--amber-dim); }
  .footer{
    margin-top: 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 10px;
    color: var(--grey);
    letter-spacing: 1px;
    padding: 0 4px;
  }
  .refresh-btn{
    background:none;
    border: 1px solid var(--line);
    color: var(--grey);
    padding: 5px 10px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    cursor:pointer;
    text-transform: uppercase;
  }
  .refresh-btn:hover{ color: var(--amber); border-color: var(--amber-dim); }
  .blink{ animation: blink 1.4s infinite; }
  @keyframes blink{ 50%{ opacity:0.35; } }
  .flap{
    display:inline-block;
    animation: flapin .5s ease;
  }
  @keyframes flapin{
    0%{ opacity:0; transform: translateY(-4px); }
    100%{ opacity:1; transform: translateY(0); }
  }
  .route-label{
    text-align:center;
    font-size: 21px;
    letter-spacing: 2px;
    color: var(--amber);
    text-shadow: 0 0 10px var(--amber-glow);
    margin: 6px 0 2px;
  }
  .route-sub{
    text-align:center;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--grey);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .note{
    text-align:center;
    font-size: 11px;
    color: var(--grey);
    margin-bottom: 14px;
    min-height: 14px;
  }
  .swap-btn{
    display:block;
    width:100%;
    max-width: 440px;
    margin: 0 auto 18px;
    padding: 13px 8px;
    background: rgba(255,179,0,0.08);
    border: 1px solid var(--amber);
    color: var(--amber);
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 14px var(--amber-glow);
  }
  .swap-btn:active{ background: var(--amber); color: var(--board-bg); }
  .footer-btns{ display:flex; gap:8px; }
  .settings{
    margin-top: 14px;
    background: var(--board-bg-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
    font-size: 12px;
  }
  .settings[hidden]{ display:none; }
  .settings label{
    display:block;
    margin: 10px 0 4px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--grey);
  }
  .settings input{
    width:100%;
    padding: 10px;
    background: var(--board-bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--amber);
    font-family: inherit;
    font-size: 16px;
  }
  .settings .btn-row{ display:flex; gap:8px; margin-top: 14px; }
  .settings .btn-row button{
    flex:1;
    padding: 10px 6px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--grey);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor:pointer;
  }
  .settings .btn-row button.primary{
    background: var(--amber);
    border-color: var(--amber);
    color: var(--board-bg);
  }
  .settings .msg{ color: var(--red); margin-top: 10px; min-height: 14px; line-height: 1.5; }
  .settings .hint{ color: var(--grey); margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1 id="page-title">—</h1>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div class="route-label" id="route-label">Locatie bepalen…</div>
  <div class="route-sub" id="route-sub"></div>
  <div class="note" id="note"></div>

  <button class="swap-btn" id="swap-btn" onclick="flipDirection()">⇄ Keer om</button>

  <div class="board">
    <div id="rows">
      <div class="empty blink">Treinen laden…</div>
    </div>
  </div>

  <button class="more-btn" id="more-btn" onclick="showMore()" hidden></button>
  <div class="time-controls" aria-label="Tijdstip bekijken">
    <button type="button" onclick="browseBackHour()">−1 uur</button>
    <button type="button" onclick="browseNow()">Nu</button>
  </div>

  <div class="settings" id="settings" hidden>
    <label for="in-a">Station A — waar je 's ochtends vertrekt</label>
    <input id="in-a" list="station-list" autocomplete="off" autocapitalize="words" spellcheck="false">
    <label for="in-b">Station B — waar je 's ochtends naartoe gaat</label>
    <input id="in-b" list="station-list" autocomplete="off" autocapitalize="words" spellcheck="false">
    <datalist id="station-list"></datalist>
    <div class="msg" id="set-msg"></div>
    <div class="btn-row">
      <button class="primary" onclick="saveSettings()">Opslaan</button>
      <button onclick="resetSettings()">Standaard</button>
      <button onclick="closeSettings()">Sluiten</button>
    </div>
    <div class="hint">Tip: voeg de pagina daarna toe aan je startscherm — je keuze zit in de link.
    Zonder locatie toont de app 's ochtends A → B en 's middags B → A.</div>
  </div>

  <div class="footer">
    <span id="last-updated">—</span>
    <div class="footer-btns">
      <button class="refresh-btn" onclick="openSettings()">⚙ Stations</button>
      <button class="refresh-btn" onclick="load()">↻ Ververs</button>
    </div>
  </div>
</div>

<script>
function $(id){ return document.getElementById(id); }
function pad(n){ return n.toString().padStart(2,'0'); }

const STORE_KEY = 'treinSettings';

// Compare station names ignoring case, accents, spaces and hyphens
function norm(t){ return (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function sameName(x, y){ return norm(x) !== '' && norm(x) === norm(y); }
function isDefault(a, b){ return sameName(a, CONFIG.stationA) && sameName(b, CONFIG.stationB); }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Which stations are active: link parameters (?a=..&b=..) win, then the choice
// saved on this device, then the defaults in CONFIG.
function readSettings(){
  let a = null, b = null;
  try{
    const q = new URLSearchParams(location.search);
    if(q.get('a') && q.get('b')){ a = q.get('a'); b = q.get('b'); }
  } catch(e){}
  if(!a){
    try{
      const st = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if(st && st.a && st.b){ a = st.a; b = st.b; }
    } catch(e){}
  }
  return { a: a || CONFIG.stationA, b: b || CONFIG.stationB };
}
let { a: A, b: B } = readSettings();
const NOW_MINUTES = CONFIG.nowMinutes || 120;
const MORE_MINUTES = CONFIG.moreMinutes || 60;
let stationListFilled = false;

let extraMinutes = 0;     // grows each time "Toon meer" is pressed
let browseOffsetMinutes = 0; // lets you inspect the timetable relative to an earlier time
let flipped = false;      // manual "other direction" override
let loadToken = 0;        // guards against slow responses arriving out of order
let stationCache = null;

function fmtDur(m){
  return m % 60 === 0 ? `${m/60} u` : `${m} min`;
}

function toMin(hhmmStr){
  const [h, m] = hhmmStr.split(':').map(Number);
  return h*60 + m;
}

function minutesNow(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}

function updateClock(){
  const d = new Date();
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
setInterval(updateClock, 1000);
updateClock();

function flipDirection(){
  flipped = !flipped;
  extraMinutes = 0;
  load();
}

function showMore(){
  extraMinutes += MORE_MINUTES;
  load(true);   // keep the current list on screen while the extra trains load
}

function browseBackHour(){
  browseOffsetMinutes -= 60;
  extraMinutes = 0;
  load();
}

function browseNow(){
  browseOffsetMinutes = 0;
  extraMinutes = 0;
  load();
}

/* ---------- date helpers ---------- */
function ddmmyy(d){ return `${pad(d.getDate())}${pad(d.getMonth()+1)}${d.getFullYear().toString().slice(-2)}`; }
function hhmm(d){ return `${pad(d.getHours())}${pad(d.getMinutes())}`; }
function fmtTime(unixSeconds){
  const d = new Date(parseInt(unixSeconds,10)*1000);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function depMs(c){ return parseInt(c.departure.time,10)*1000; }
// scheduled departure + delay = when the train really leaves
function depEffectiveMs(c){ return depMs(c) + parseInt(c.departure.delay || '0', 10)*1000; }

/* ---------- iRail ---------- */
async function fetchBatch(s, when){
  const url = `https://api.irail.be/connections/?from=${encodeURIComponent(s.from)}&to=${encodeURIComponent(s.to)}&date=${ddmmyy(when)}&time=${hhmm(when)}&timesel=departure&results=10&format=json&lang=en`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return data.connection || [];
}

// All departures between startDate and endDate. The API returns a limited
// number of connections per request, so keep asking, moving past the last
// departure each time, until the whole window is covered.
async function fetchWindow(s, startDate, endDate){
  const seen = new Map();
  let cursor = new Date(startDate);
  let guard = 0;
  while(cursor <= endDate && guard < 10){
    guard++;
    const batch = await fetchBatch(s, cursor);
    if(batch.length === 0) break;
    let last = cursor.getTime();
    for(const c of batch){
      const t = depMs(c);
      if(t >= startDate.getTime() && t <= endDate.getTime()){
        const key = c.departure.departureConnection || (c.departure.time + '-' + c.departure.vehicle);
        seen.set(key, c);
      }
      if(t > last) last = t;
    }
    if(last <= cursor.getTime()) break; // no progress, avoid infinite loop
    cursor = new Date(last + 60000);
  }
  return Array.from(seen.values()).sort((a,b) => depMs(a) - depMs(b));
}

async function loadStations(){
  if(stationCache) return stationCache;
  const res = await fetch('https://api.irail.be/stations/?format=json&lang=nl');
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  stationCache = data.station || [];
  return stationCache;
}

function findStation(list, name){
  const n = name.trim().toLowerCase();
  const std = s => (s.standardname || '').toLowerCase();
  const nm = s => (s.name || '').toLowerCase();
  return list.find(s => std(s) === n || nm(s) === n)
      || list.find(s => std(s).startsWith(n));
}

function coordsOf(st){
  let lat = parseFloat(st.locationY), lon = parseFloat(st.locationX);
  if(lat < lon){ const t = lat; lat = lon; lon = t; } // Belgium: lat (~51) is always larger than lon (~4)
  return { lat, lon };
}

/* ---------- location ---------- */
function getPosition(){
  return new Promise((resolve, reject) => {
    if(!navigator.geolocation) return reject({ code: 0 });
    navigator.geolocation.getCurrentPosition(
      p => resolve(p.coords),
      e => reject(e),
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
    );
  });
}

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function fmtDist(km){
  return km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1).replace('.', ',')} km`;
}

// Direction used when there is no location: A → B from firstDirectionFrom
// until secondDirectionFrom, B → A the rest of the day.
function fallbackRoute(){
  const n = minutesNow();
  const first = toMin(CONFIG.firstDirectionFrom || '01:00');
  const second = toMin(CONFIG.secondDirectionFrom || '12:00');
  return (n >= first && n < second) ? { from: A, to: B } : { from: B, to: A };
}

// Departs from whichever of the two stations is closest to you.
async function resolveRoute(){
  const routes = [{ from: A, to: B }, { from: B, to: A }];
  let route = fallbackRoute();
  let note;
  try{
    const [pos, stations] = await Promise.all([getPosition(), loadStations()]);
    let best = null;
    for(const r of routes){
      const st = findStation(stations, r.from);
      if(!st) continue;
      const c = coordsOf(st);
      const d = haversineKm(pos.latitude, pos.longitude, c.lat, c.lon);
      if(!best || d < best.d) best = { r, d };
    }
    if(best){
      route = best.r;
      note = `📍 Dichtstbij: ${best.r.from} (${fmtDist(best.d)})`;
    } else {
      note = 'Station niet gevonden — richting volgens het uur';
    }
  } catch(e){
    note = (e && e.code === 1)
      ? 'Locatie geweigerd — richting volgens het uur'
      : 'Locatie niet beschikbaar — richting volgens het uur';
  }
  if(flipped){
    route = { from: route.to, to: route.from };
    note += ' · omgekeerd';
  }
  return { route, note };
}

/* ---------- main ---------- */
async function load(quiet){
  const token = ++loadToken;
  const rowsEl = $('rows');
  if(!quiet) rowsEl.innerHTML = '<div class="empty blink">Treinen laden…</div>';

  try{
    const { route, note } = await resolveRoute();
    if(token !== loadToken) return;

    const now = new Date(Date.now() + browseOffsetMinutes * 60000);
    const span = NOW_MINUTES + extraMinutes;
    const start = new Date(now.getTime() - 10*60000);   // catch trains that are delayed
    const end = new Date(now.getTime() + span*60000);

    $('route-label').textContent = `${route.from} → ${route.to}`;
    $('route-sub').textContent = browseOffsetMinutes === 0
      ? `nu → +${fmtDur(span)}`
      : `${fmtDur(Math.abs(browseOffsetMinutes))} terug · ${pad(now.getHours())}:${pad(now.getMinutes())} → +${fmtDur(span)}`;
    $('note').textContent = note;
    $('swap-btn').textContent = `⇄ Keer om · ${route.to} → ${route.from}`;

    let conns = await fetchWindow(route, start, end);
    if(token !== loadToken) return;
    conns = conns.filter(c =>
      depEffectiveMs(c) >= now.getTime() ||
      (c.departure.canceled === '1' && depMs(c) >= now.getTime())
    );

    if(conns.length === 0){
      rowsEl.innerHTML = `<div class="empty">Geen treinen in de komende ${fmtDur(span)}.<br>Probeer "Toon meer" of controleer belgiantrain.be.</div>`;
    } else {
      renderRows(conns);
    }

    $('more-btn').textContent = `▾ Toon meer · +${fmtDur(MORE_MINUTES)}`;
    $('more-btn').hidden = false;

    const n = new Date();
    $('last-updated').textContent = `bijgewerkt ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  } catch(err){
    if(token !== loadToken) return;
    $('more-btn').hidden = true;
    if(/^HTTP (400|404)/.test(err.message || '')){
      rowsEl.innerHTML = `<div class="error">Station niet gevonden of ongeldig: ${esc(A)} / ${esc(B)}.<br>Pas ze aan via ⚙ Stations.</div>`;
    } else {
      rowsEl.innerHTML = `<div class="error">Kan geen verbinding maken met de iRail-data.<br>${esc(err.message)}<br><br>Controleer je internetverbinding of probeer later opnieuw.</div>`;
    }
  }
}

function renderRow(c, isNext, isPast){
  const dep = c.departure;
  const delaySec = parseInt(dep.delay || '0', 10);
  const platform = dep.platform || '?';
  const vehicle = (dep.vehicleinfo && dep.vehicleinfo.shortname) || (c.vehicle || '').split('.').pop() || '';
  const delayLabel = delaySec > 0
    ? `<span class="delay late">+${Math.round(delaySec/60)}′</span>`
    : `<span class="delay ontime">op tijd</span>`;
  const canceled = dep.canceled === '1';
  return `<div class="row ${isNext ? 'next' : ''} ${isPast ? 'past' : ''} ${canceled ? 'cancelled' : ''} flap">
    <div class="time">${fmtTime(dep.time)}</div>
    <div class="via">${vehicle}</div>
    <div class="meta">
      <span class="plat">${platform}</span>
      ${canceled ? '<span class="delay late">geschrapt</span>' : delayLabel}
    </div>
  </div>`;
}

function renderRows(conns){
  const nowMs = Date.now();
  let nextMarked = false;
  $('rows').innerHTML = conns.map(c => {
    const isPast = depEffectiveMs(c) <= nowMs;
    const isNext = !nextMarked && !isPast;
    if(isNext) nextMarked = true;
    return renderRow(c, isNext, isPast);
  }).join('');
}

/* ---------- stations picker, link and "save as app" ---------- */
let manifestUrl = null;

function syncUrl(){
  try{
    const url = isDefault(A, B)
      ? location.pathname
      : `${location.pathname}?a=${encodeURIComponent(A)}&b=${encodeURIComponent(B)}`;
    history.replaceState(null, '', url + location.hash);
  } catch(e){}
}

// A manifest generated at runtime, so that "install app" on Android keeps the
// chosen stations in its start link (a fixed manifest.json would forget them).
function updateManifest(){
  try{
    if(!/^https?:/.test(location.protocol)) return;
    const base = location.origin + location.pathname.replace(/[^/]*$/, '');
    const manifest = {
      name: `${A} ⇄ ${B}`,
      short_name: 'Trein',
      start_url: location.origin + location.pathname + location.search,
      scope: base,
      display: 'standalone',
      background_color: '#0c0e0a',
      theme_color: '#0c0e0a',
      icons: [
        { src: base + 'icon-192.png', sizes: '192x192', type: 'image/png' },
        { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const old = manifestUrl;
    manifestUrl = URL.createObjectURL(blob);
    $('manifest-link').setAttribute('href', manifestUrl);
    if(old) URL.revokeObjectURL(old);
  } catch(e){}
}

function applySettingsToPage(){
  $('page-title').textContent = `${A} ⇄ ${B}`;
  document.title = `${A} ⇄ ${B}`;
  syncUrl();
  updateManifest();
}

async function openSettings(){
  $('settings').hidden = false;
  $('in-a').value = A;
  $('in-b').value = B;
  $('set-msg').textContent = '';
  $('settings').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  try{
    const list = await loadStations();
    if(!stationListFilled){
      $('station-list').innerHTML = list.map(s => `<option value="${esc(s.name)}"></option>`).join('');
      stationListFilled = true;
    }
  } catch(e){}
}

function closeSettings(){ $('settings').hidden = true; }

function exactStation(list, name){
  return list.find(s => sameName(s.name, name) || sameName(s.standardname, name));
}

async function saveSettings(){
  const a = $('in-a').value.trim(), b = $('in-b').value.trim();
  const msg = $('set-msg');
  if(!a || !b){ msg.textContent = 'Vul beide stations in.'; return; }
  if(sameName(a, b)){ msg.textContent = 'Kies twee verschillende stations.'; return; }

  let ca = a, cb = b, list = null;
  try{ list = await loadStations(); } catch(e){}   // no list -> accept as typed
  if(list){
    const ra = exactStation(list, a), rb = exactStation(list, b);
    const bad = [!ra && a, !rb && b].filter(Boolean);
    if(bad.length){
      const sug = list.filter(s => norm(s.name).includes(norm(bad[0]))).slice(0, 3).map(s => s.name);
      msg.textContent = `Niet gevonden: ${bad.map(x => `"${x}"`).join(', ')}. ` +
        (sug.length ? `Bedoelde je: ${sug.join(', ')}?` : 'Kies uit de lijst.');
      return;
    }
    ca = ra.name; cb = rb.name;
  }

  A = ca; B = cb;
  flipped = false;
  extraMinutes = 0;
  try{
    if(isDefault(A, B)) localStorage.removeItem(STORE_KEY);
    else localStorage.setItem(STORE_KEY, JSON.stringify({ a: A, b: B }));
  } catch(e){}
  applySettingsToPage();
  closeSettings();
  load();
}

function resetSettings(){
  $('in-a').value = CONFIG.stationA;
  $('in-b').value = CONFIG.stationB;
  saveSettings();
}

applySettingsToPage();
load();
setInterval(() => load(true), 60000);
</script>
